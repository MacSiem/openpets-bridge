[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpets-bridge"
version = "0.1.1"
description = "Multi-AI desktop pet bridge for OpenPets — show every coding agent's status on one shared pet (or one pet per AI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maciej Siemiński", email = "maciek.sieminski@gmail.com" }]
keywords = ["openpets", "ai-agents", "desktop-pet", "claude", "codex", "cowork", "menubar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]
dependencies = []  # zero runtime deps — stdlib only

[project.optional-dependencies]
toml = ["tomli;python_version<'3.11'"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
openpets-bridge = "openpets_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/MacSiem/openpets-bridge"
Issues = "https://github.com/MacSiem/openpets-bridge/issues"
"OpenPets" = "https://github.com/alterhq/openpets"

[tool.hatch.build.targets.wheel]
packages = ["openpets_bridge"]

[tool.ruff]
line-length = 100
target-version = "py310"
